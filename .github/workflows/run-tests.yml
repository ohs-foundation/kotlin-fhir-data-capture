name: Run Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-tests:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # xvfb is required for Compose Multiplatform desktop/JVM UI tests running in a headless CI environment.
          - target: ":datacapture:jvmTest"
            name: JVM
            os: ubuntu-latest
            xvfb: true
          - target: ":datacapture:wasmJsBrowserTest"
            name: Wasm
            os: ubuntu-latest
            xvfb: false
          - target: ":datacapture:jsBrowserTest"
            name: JS
            os: ubuntu-latest
            xvfb: false
          - target: ":datacapture:iosSimulatorArm64Test"
            name: iOS Simulator
            os: macos-latest
            xvfb: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Fetch origin/main for Spotless ratchet
        run: git fetch origin main

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Add swap space
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Cache Kotlin/Native
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/.lock') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check code formatting (Spotless)
        if: matrix.name == 'JVM'
        run: ./gradlew spotlessCheck --no-configuration-cache

      - name: Run tests
        if: ${{ !matrix.xvfb }}
        env:
          GRADLE_OPTS: -Xmx6g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
        run: >-
          ./gradlew ${{ matrix.target }}
          --stacktrace
          --no-daemon
          --no-parallel
          --no-configuration-cache
          --build-cache
          -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
          -Dorg.gradle.workers.max=1
          -Dkotlin.daemon.enabled=false

      # Run tests that require UI interaction (like JVM desktop Compose UI tests) using xvfb-run
      # to provide a virtual framebuffer in the headless environment, preventing graphic environment exceptions.
      - name: Run tests (with xvfb)
        if: ${{ matrix.xvfb }}
        env:
          GRADLE_OPTS: -Xmx6g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
        run: >-
          xvfb-run --auto-servernum
          ./gradlew ${{ matrix.target }}
          --stacktrace
          --no-daemon
          --no-parallel
          --no-configuration-cache
          --build-cache
          -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
          -Dorg.gradle.workers.max=1
          -Dkotlin.daemon.enabled=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.name }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14

  # androidDeviceTest depends on commonTest, so the full common suite runs on an emulator.
  # This is the only job that exercises the Android `actual` implementations (date/time
  # formatting, number formatting, media handling).
  android-emulator:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # minSdk is 26; API 34 is the newest level with reliable google_apis x86_64 images.
      API_LEVEL: 34

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # The emulator requires hardware acceleration. GitHub's Linux runners support nested
      # virtualisation but do not grant access to /dev/kvm by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # A cold AVD boot costs several minutes; the cached snapshot avoids it on every run
      # after the first for a given API level.
      - name: Cache AVD snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumented tests
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          GRADLE_OPTS: -Xmx6g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >-
            ./gradlew :datacapture:connectedAndroidDeviceTest --stacktrace
            --no-daemon --no-parallel --no-configuration-cache --build-cache
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
            -Dorg.gradle.workers.max=1 -Dkotlin.daemon.enabled=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-Android
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 14
