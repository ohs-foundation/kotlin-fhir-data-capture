/*
 * Writes the JVM and Android runtime classpaths of each library project to
 * build/binary-size/dependencies.json for scripts/binary-size-report.py.
 *
 *   ./gradlew --init-script scripts/binary-size-dependencies.init.gradle \
 *     :datacapture:binarySizeDependencies --no-configuration-cache
 */

import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier

def runtimeClasspaths = ["jvm": "jvmRuntimeClasspath", "android": "androidRuntimeClasspath"]

allprojects {
  afterEvaluate { project ->
    def configurations = runtimeClasspaths.findAll { _, name ->
      project.configurations.findByName(name) != null
    }
    if (configurations.isEmpty()) return

    project.tasks.register("binarySizeDependencies") {
      group = "reporting"
      description = "Writes the resolved runtime classpaths used by the binary size report."
      def outputFile = project.layout.buildDirectory.file("binary-size/dependencies.json")
      outputs.file(outputFile)
      outputs.upToDateWhen { false }

      doLast {
        def report = [:]
        configurations.each { target, configurationName ->
          def artifacts = project.configurations.getByName(configurationName)
            .incoming.artifacts.artifacts
          report[target] = artifacts.collect { artifact ->
            def id = artifact.id.componentIdentifier
            def entry = [file: artifact.file.absolutePath, bytes: artifact.file.length()]
            if (id instanceof ModuleComponentIdentifier) {
              entry.module = "${id.group}:${id.module}"
              entry.version = id.version
            } else if (id instanceof ProjectComponentIdentifier) {
              entry.module = "project${id.projectPath}"
            } else {
              entry.module = artifact.file.name
            }
            entry
          }.unique { it.file }.sort { it.module }
        }
        def file = outputFile.get().asFile
        file.parentFile.mkdirs()
        file.text = JsonOutput.prettyPrint(JsonOutput.toJson(report))
        println("Wrote ${file}")
      }
    }
  }
}
